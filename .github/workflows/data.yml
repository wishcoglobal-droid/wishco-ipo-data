name: IPO Desk data
on:
  schedule:
    - cron: '7,37 2-18 * * 1-5'   # Mon-Fri, about 07:37 to 23:37 IST, twice an hour
    - cron: '7 4,10 * * 0,6'      # Sat-Sun, twice a day
  workflow_dispatch:
  push:
    paths: ['engine/**', '.github/workflows/**']
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Market
        run: python engine/market.py || true
      - name: IPO list
        run: python engine/ipos.py || true
      - name: Probe
        run: python engine/probe.py || true
      - name: Save
        run: |
          git config user.name "ipo-desk-bot"
          git config user.email "ipo-desk-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -q -m "data $(TZ=Asia/Kolkata date '+%d %b %H:%M')"
          git pull -q --rebase origin main || true
          git push -q
