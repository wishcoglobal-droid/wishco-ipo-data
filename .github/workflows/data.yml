name: IPO Desk data
on:
  schedule:
    - cron: '2,17,32,47 1-18 * * *'   # every day, about 06:30 to 23:50 IST, four times an hour
    - cron: '7 19-23,0 * * *'         # night, once an hour
  workflow_dispatch:
  push:
    paths: ['engine/**', '.github/workflows/**']
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exchange filings first
        run: python engine/filings.py || true
      - name: Market
        run: python engine/market.py || true
      - name: IPO list
        run: python engine/ipos.py || true
      - name: Save
        run: |
          git config user.name "ipo-desk-bot"
          git config user.email "ipo-desk-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -q -m "data $(TZ=Asia/Kolkata date '+%d %b %H:%M')"
          git pull -q --rebase origin main || true
          git push -q
